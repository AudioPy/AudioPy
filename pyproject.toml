[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "audiopy"
version = "0.1.0"
description = "A generalised Python library for audio editing and effects, inspired by OpenCV."
authors = [
    { name = "Your Team Name", email = "your.email@example.com" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"


dependencies = [
    "numpy>=1.23",
    "scipy>=1.10",
    "soundfile>=0.12",
    "matplotlib>=3.7"
]


[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pre-commit>=3.0"
]
extra = [
    "librosa>=0.10"
]

[project.urls]
Homepage = "https://github.com/YourOrgName/audiopy"
Repository = "https://github.com/YourOrgName/audiopy"
Issues = "https://github.com/YourOrgName/audiopy/issues"
